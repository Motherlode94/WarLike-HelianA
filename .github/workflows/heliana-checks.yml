name: HelianA — quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check core.js
          node --check games.js
          node --check games-core.js
          node --check curriculum.js
      - name: Lesson and communication tests
        run: node --test tests/*.test.mjs
      - name: Static asset integrity
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f core.js
          test -f games.html
          test -f games.css
          test -f games.js
          test -f games-core.js
          test -f curriculum.js
