name: HelianA accessibility and learning checks
on:
  pull_request:
    branches: [main, feat/heliana-v5-voice-aac-accessibility-20261119, feat/heliana-v6-communication-print-20261119, feat/heliana-v7-symbols-duo-qa-20261119, feat/heliana-v11-educator-builder-20261119, feat/heliana-warscript-junior-20261119, feat/heliana-v12-offline-warjunior-20261119, feat/heliana-navigation-folders-20261119, fix/heliana-exclusive-submenus-20261119]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check pathways.js
          node --check games.js
          node --check communication.js
          node --check pictograms.js
          node --check duo-practice.js
          node --check facilitator.js
          node --check warscript-junior.js
          node --check warscript-junior-core.js
          node --check service-worker.js
          node --check pwa.js
          node --check navigation.js
      - name: Test learning content and accessibility
        run: node --test tests/*.test.mjs
